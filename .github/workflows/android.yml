name: Build AppMarket APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug and Release APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. 获取源代码
      # ============================================================
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ============================================================
      # 2. 安装 JDK 21
      # ============================================================
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle


      # ============================================================
      # 3. 配置 Gradle
      # ============================================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4


      # ============================================================
      # 4. 给 Gradle Wrapper 执行权限
      # ============================================================
      - name: Make Gradle executable
        run: chmod +x ./gradlew


      # ============================================================
      # 5. 检查环境
      # ============================================================
      - name: Check build environment
        run: |
          echo "========== Java =========="
          java -version

          echo ""
          echo "========== Gradle =========="
          ./gradlew --version


      # ============================================================
      # 6. 清理旧构建
      # ============================================================
      - name: Clean project
        run: |
          ./gradlew clean --stacktrace --no-daemon


      # ============================================================
      # 7. 编译 Debug APK
      #
      # 不提供 KEYSTORE_PATH
      # 因此项目使用默认 Debug 签名
      # ============================================================
      - name: Build Debug APK
        run: |
          ./gradlew \
            :app:android:assembleDebug \
            --stacktrace \
            --no-daemon


      # ============================================================
      # 8. 编译 Release APK
      #
      # 不提供 KEYSTORE_PATH
      # 项目会自动使用 debug signingConfig
      #
      # 之后可以使用 MT 管理器重新签名
      # ============================================================
      - name: Build Release APK
        run: |
          ./gradlew \
            :app:android:assembleRelease \
            --stacktrace \
            --no-daemon


      # ============================================================
      # 9. 查找生成的 APK
      # ============================================================
      - name: Find APK files
        run: |
          echo "========================================"
          echo "Generated APK files"
          echo "========================================"

          find app/android/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          echo "========================================"


      # ============================================================
      # 10. 整理 APK
      # ============================================================
      - name: Prepare APK files
        run: |
          set -e

          mkdir -p apk-output

          DEBUG_APK=$(find \
            app/android/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            | head -n 1)

          RELEASE_APK=$(find \
            app/android/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            | head -n 1)

          echo "Debug APK:"
          echo "$DEBUG_APK"

          echo ""
          echo "Release APK:"
          echo "$RELEASE_APK"

          if [ -z "$DEBUG_APK" ]; then
            echo "ERROR: Debug APK not found."
            exit 1
          fi

          if [ -z "$RELEASE_APK" ]; then
            echo "ERROR: Release APK not found."
            exit 1
          fi

          cp "$DEBUG_APK" \
            "apk-output/AppMarket-debug.apk"

          cp "$RELEASE_APK" \
            "apk-output/AppMarket-release.apk"


      # ============================================================
      # 11. 验证 APK 文件
      # ============================================================
      - name: Verify APK files
        run: |
          set -e

          echo "========================================"
          echo "APK information"
          echo "========================================"

          ls -lh apk-output/

          echo ""
          echo "========================================"
          echo "APK SHA256"
          echo "========================================"

          sha256sum apk-output/*.apk


      # ============================================================
      # 12. 验证
