name: Build AppMarket APK

on:
  workflow_dispatch:

# 创建 GitHub Release 必须有写权限
permissions:
  contents: write

jobs:
  build:
    name: Build Debug and Release APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. 获取源代码
      # ============================================================
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0


      # ============================================================
      # 2. 安装 JDK 21
      # ============================================================
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle


      # ============================================================
      # 3. 配置 Gradle
      # ============================================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5


      # ============================================================
      # 4. 给 Gradle Wrapper 执行权限
      # ============================================================
      - name: Make Gradle executable
        run: chmod +x ./gradlew


      # ============================================================
      # 5. 读取上游项目版本号
      #
      # 不修改任何源码
      # 直接读取 ProjectConfig.kt 中的 VERSION_NAME
      # ============================================================
      - name: Read App Version
        id: version
        shell: bash
        run: |
          set -e

          VERSION_NAME=$(sed -n 's/.*VERSION_NAME = "\([^"]*\)".*/\1/p' \
            buildSrc/src/main/kotlin/ProjectConfig.kt | head -n 1)

          VERSION_CODE=$(sed -n 's/.*VERSION_CODE = \([0-9]*\).*/\1/p' \
            buildSrc/src/main/kotlin/ProjectConfig.kt | head -n 1)

          if [ -z "$VERSION_NAME" ]; then
            echo "ERROR: VERSION_NAME not found."
            exit 1
          fi

          if [ -z "$VERSION_CODE" ]; then
            echo "ERROR: VERSION_CODE not found."
            exit 1
          fi

          echo "VERSION_NAME=$VERSION_NAME"
          echo "VERSION_CODE=$VERSION_CODE"

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 6. 显示版本信息
      # ============================================================
      - name: Show App Version
        run: |
          echo "========================================"
          echo "AppMarket Version"
          echo "========================================"
          echo "Version Name: ${{ steps.version.outputs.version_name }}"
          echo "Version Code: ${{ steps.version.outputs.version_code }}"
          echo "Release Tag: v${{ steps.version.outputs.version_name }}"
          echo "========================================"


      # ============================================================
      # 7. 检查环境
      # ============================================================
      - name: Check build environment
        run: |
          echo "========== Java =========="
          java -version

          echo ""
          echo "========== Gradle =========="
          ./gradlew --version


      # ============================================================
      # 8. 清理旧构建
      # ============================================================
      - name: Clean project
        run: |
          ./gradlew clean --stacktrace --no-daemon


      # ============================================================
      # 9. 编译 Debug APK
      #
      # 不提供 KEYSTORE_PATH
      # 项目自动使用默认 Debug 签名
      # ============================================================
      - name: Build Debug APK
        run: |
          ./gradlew \
            :app:android:assembleDebug \
            --stacktrace \
            --no-daemon


      # ============================================================
      # 10. 编译 Release APK
      #
      # 不提供 KEYSTORE_PATH
      # 项目自动使用 debug signingConfig
      #
      # 不修改签名配置
      # ============================================================
      - name: Build Release APK
        run: |
          ./gradlew \
            :app:android:assembleRelease \
            --stacktrace \
            --no-daemon


      # ============================================================
      # ============================================================
      # 11. 查找并整理生成的 APK
      # ============================================================
      - name: Prepare APK files
        run: |
          set -e

          mkdir -p apk-output

          echo "========================================"
          echo "Generated APK files"
          echo "========================================"

          find app/android/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          echo "========================================"

          DEBUG_APK=$(find \
            app/android/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            | head -n 1)

          RELEASE_APK=$(find \
            app/android/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            | head -n 1)

          echo "Debug APK:"
          echo "$DEBUG_APK"

          echo ""
          echo "Release APK:"
          echo "$RELEASE_APK"

          if [ -z "$DEBUG_APK" ]; then
            echo "ERROR: Debug APK not found."
            exit 1
          fi

          if [ -z "$RELEASE_APK" ]; then
            echo "ERROR: Release APK not found."
            exit 1
          fi

          # 保留 Gradle 原本生成的文件名（我发现发布到release的小版本号括号变成.，所以对下面代码进行修改）
          cp "$DEBUG_APK" \
  "apk-output/AppMarket-v${{ steps.version.outputs.version_name }}
(${{ steps.version.outputs.version_code }}
)_debug.apk"

          cp "$RELEASE_APK" \
  "apk-output/AppMarket-v${{ steps.version.outputs.version_name }}
(${{ steps.version.outputs.version_code }}
).apk"


      # ============================================================
      # 12. 验证 APK
      # ============================================================
      - name: Verify APK files
        run: |
          set -e

          echo "========================================"
          echo "APK files"
          echo "========================================"

          ls -lh apk-output/

          echo ""
          echo "========================================"
          echo "APK SHA256"
          echo "========================================"

          sha256sum apk-output/*.apk


      # ============================================================
      # 13. 创建 GitHub Release
      #
      # 自动读取上游 VERSION_NAME
      # 例如：
      # VERSION_NAME = 2.3.1
      #
      # 自动创建：
      # v2.3.1
      #
      # 并上传 Debug + Release 两个 APK
      # ============================================================
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          name: AppMarket v${{ steps.version.outputs.version_name }}
          generate_release_notes: true
          files: |
            apk-output/*.apk
